.app{max-width:820px;margin:auto;padding:16px;padding-bottom:calc(24px + env(safe-area-inset-bottom))}

h1{margin:0;font-size:clamp(30px,8vw,48px);line-height:1} header p{margin:8px 0 0;opacity:.9}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px} .stat{background:#ffffff20;border:1px solid #ffffff2b;border-radius:13px;padding:10px;text-align:center} .stat b{display:block;font-size:22px}

.tab,.btn,.option,.pill{border:1px solid var(--line);background:white;border-radius:13px;cursor:pointer}
.tab{padding:12px 8px;font-weight:750;min-width:0;width:100%;white-space:normal;line-height:1.15} .tab.active{background:var(--blue);color:white;border-color:var(--blue)}
.card{background:white;border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 5px 18px #14202d10}
.kicker{font-size:12px;color:var(--blue);font-weight:850;letter-spacing:.09em;text-transform:uppercase}
.question{font-size:24px;font-weight:850;line-height:1.18;margin:7px 0 16px} .sub{color:var(--muted);margin-bottom:14px}
.options{display:grid;gap:9px} .option{padding:13px 14px;text-align:left;font-size:16px} .option.correct{background:#e8f7ef;border-color:#77c89e} .option.wrong{background:#fff0f0;border-color:#e6a0a3}
.pills{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.pill{width:100%;aspect-ratio:1 / 1;height:auto;min-height:0;padding:0;display:flex;align-items:center;justify-content:center;font-weight:750;position:relative;box-sizing:border-box}.pill.sel{outline:none}.pill.sel .badge{background:#0a64b7;color:#fff;border-color:#0a64b7}
/* Auswertung Mehrfachauswahl: Nur die Linienkreise ändern ihre Farbe.

.pill.result-state{background:#fff;color:inherit;border-color:var(--line);}
.pill.result-state .badge.result-correct{background:#0a64b7;color:#fff;border-color:#0a64b7;}
.pill.result-state .badge.result-wrong{background:#e3262e;color:#fff;border-color:#e3262e;}
.pill.result-state .badge.result-missed{background:#111;color:#fff;border-color:#111;}
.connection-legend{display:grid;grid-template-columns:1fr;margin-top:14px;border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden}
.connection-legend-item{display:grid;grid-template-columns:42px minmax(150px,220px) 1fr;gap:12px;padding:11px 12px;align-items:center;min-width:0}
.connection-legend-item + .connection-legend-item{border-top:1px solid var(--line)}
.connection-legend-icon{width:38px;height:38px;border-radius:50%;display:block}
.connection-legend-icon.correct{background:#0a64b7}
.connection-legend-icon.wrong{background:#e3262e}
.connection-legend-icon.missed{background:#111}
.connection-legend-title{font-weight:850;line-height:1.15;margin-bottom:0}
.connection-legend-title.correct{color:#0a64b7}
.connection-legend-title.wrong{color:#e3262e}
.connection-legend-text{font-size:12px;line-height:1.3;color:var(--ink)}

function sample(a){return a[Math.floor(Math.random()*a.length)]}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function norm(s){return s.toLowerCase().replace(/^zürich[ ,]+/,'').replace(/\bbhf\.?\b/g,'bahnhof').replace(/\bbahnhof n\b/g,'bahnhof nord').replace('bahnhofstrasse/hb','bahnhofstr./hb').replace('bahnhofstr./hb','bahnhofstrasse hb').replace(/[.,/()-]/g,' ').replace(/\s+/g,' ').trim()}
function same(a,b){let A=norm(a),B=norm(b);if(A===B)return true;if(A.includes(B)||B.includes(A))return Math.min(A.length,B.length)>6;return false}
function linesAt(stop){return LINES.filter(l=>ROUTES[l].some(s=>same(s,stop)))}
function numericSort(a,b){return Number(a)-Number(b)}
function resultLegend(){return `<div class="result-legend"><span><i class="legend-dot result-correct"></i> richtig gewählt</span><span><i class="legend-dot result-wrong"></i> falsch gewählt</span><span><i class="legend-dot result-missed"></i> richtig, nicht gewählt</span></div>`}
function questionKey(q){
  if(!q)return'';
  const pair=Array.isArray(q.pair)?q.pair.join('>'):(q.pair?`${q.pair.a||''}+${q.pair.b||''}`:'');
  return [q.type,q.stop||'',q.line||'',q.i??'',q.src||'',pair,q.subtype||'',q.base||''].join('|');
}
function pushUnique(list,q,max=350){
  const key=questionKey(q);if(!key)return;
  const idx=list.findIndex(x=>questionKey(x)===key);if(idx>=0)list.splice(idx,1);
  list.push({...q});if(list.length>max)list.splice(0,list.length-max);
}
function register(ok,q){attempts++;if(ok)score++;else if(q)pushUnique(mistakes,q);save()}
function rememberCurrent(){lastQuestionKey=questionKey(current)}
function recordHistory(type,key,limit=HISTORY_LIMITS[type]||12){
  if(!questionHistory[type])questionHistory[type]=[];
  questionHistory[type]=questionHistory[type].filter(x=>x!==key);
  questionHistory[type].push(key);
  if(questionHistory[type].length>limit)questionHistory[type].splice(0,questionHistory[type].length-limit);
  save();
}
function freshPick(type,items,keyFn=x=>String(x),limit=HISTORY_LIMITS[type]||12){
  if(!items.length)return null;
  const recent=new Set(questionHistory[type]||[]);
  let available=items.filter(x=>!recent.has(keyFn(x)));
  if(!available.length){questionHistory[type]=[];available=[...items]}
  const picked=sample(available);recordHistory(type,keyFn(picked),limit);return picked;
}
function freshImage(){
  const recentImages=new Set(questionHistory.images||[]),recentStops=new Set(questionHistory.imageStops||[]);
  let pool=IMAGE_QUIZ.filter(x=>!recentImages.has(x.src)&&!recentStops.has(x.stop));
  if(!pool.length)pool=IMAGE_QUIZ.filter(x=>!recentImages.has(x.src));
  if(!pool.length){questionHistory.images=[];pool=[...IMAGE_QUIZ]}
  const item=sample(pool);recordHistory('images',item.src);recordHistory('imageStops',item.stop);return item;
}

function mapPick(ev){
  if(current?.answered) return;
  const wrap=document.getElementById('mapwrap');
  const rect=wrap.getBoundingClientRect();
  const x=((ev.clientX-rect.left)/rect.width)*100;
  const y=((ev.clientY-rect.top)/rect.height)*100;
  const [tx,ty]=HOTSPOTS[current.stop];

  // Compare in actual screen pixels, not percentage units.
  // This avoids false negatives caused by different map aspect ratios.
  const tapX=(x/100)*rect.width;
  const tapY=(y/100)*rect.height;
  const targetX=(tx/100)*rect.width;
  const targetY=(ty/100)*rect.height;
  const distPx=Math.hypot(tapX-targetX,tapY-targetY);

  // Generous mobile hit radius: minimum 34px, scales slightly on larger screens.
  const hitRadius=Math.max(34, Math.min(48, rect.width*0.085));
  const ok=distPx<=hitRadius;
  const inExam=examActive&&mode==='exam';
  if(inExam)stopExamTimer();
  current.answered=true;
  register(ok,current);

  const marker=document.createElement('div');
  marker.className='mapmarker '+(ok?'pick':'answer');
  marker.style.left=(ok?x:tx)+'%';
  marker.style.top=(ok?y:ty)+'%';
  wrap.appendChild(marker);

  const f=document.getElementById('fb');
  f.className='feedback '+(ok?'ok':'bad');
  f.innerHTML=ok ? `Treffer! <b>${current.stop}</b>.`
                 : `Nicht ganz. Der <b>grüne Punkt</b> zeigt die Position von <b>${current.stop}</b>.`;

  const controls=document.querySelector('.controls');
  if(!inExam && controls)controls.innerHTML='<div class="control-left"><button class="btn" onclick="skipQuestion()">Überspringen →</button><button class="btn" onclick="next()">Weiter →</button></div>';
  if(inExam){examRecord(ok);setTimeout(()=>{if(examActive&&mode==='exam')qExam()},1100)}
}

function qNodes(q=null){

  const line=q?.line||freshPick('nodes',eligible,l=>l);
  const correct=IMPORTANT_NODES_BY_LINE[line];

  const allNodes=[...new Set(Object.values(IMPORTANT_NODES_BY_LINE).flat())];
  const distractors=shuffle(allNodes.filter(n=>!correct.includes(n)))
    .slice(0, Math.max(3, Math.min(5, 9-correct.length)));
  const choices=shuffle([...correct,...distractors]);

  current={type:'nodes',line,correct};

  quiz.innerHTML=`
    <div class="kicker">Wichtige Knotenpunkte</div>
    <div class="question">Welche wichtigen Knotenpunkte befinden sich auf Linie ${badge(line)}?</div>

function checkNodes(){
  if(current?.type!=='nodes' || current?.answered) return;
  current.answered=true;
  const selected=[...document.querySelectorAll('.nodepill.sel')]
    .map(x=>decodeURIComponent(x.dataset.name));

  const s=[...selected].sort((a,b)=>a.localeCompare(b));
  const c=[...current.correct].sort((a,b)=>a.localeCompare(b));
  const ok=JSON.stringify(s)===JSON.stringify(c);
  const inExam=examActive&&mode==='exam';if(inExam)stopExamTimer();
  register(ok,current);

  document.querySelectorAll('.nodepill').forEach(el=>{
    const n=decodeURIComponent(el.dataset.name);
    const isCorrect=current.correct.includes(n);
    const isSelected=el.classList.contains('sel');
    if(isCorrect) el.classList.add('correct');
    if(isSelected && !isCorrect) el.classList.add('wrong');
  });

  const all=[...new Set([...selected,...current.correct])].sort((a,b)=>displayNodeName(a).localeCompare(displayNodeName(b),'de'));
  const result=all.map(n=>{
    const chosen=selected.includes(n), right=current.correct.includes(n);
    const cls=chosen?(right?'result-correct':'result-wrong'):'result-missed';
    return `<span class="node-result ${cls}">${displayNodeName(n)}</span>`;
  }).join(' ');
  const f=document.getElementById('fb');
  f.className='feedback '+(ok?'ok':'bad');
  f.innerHTML=`${ok?'Richtig':'Auswertung'}: <div class="node-results">${result}</div><div class="result-legend"><span><i class="legend-dot result-correct"></i> richtig gewählt</span><span><i class="legend-dot result-wrong"></i> falsch gewählt</span><span><i class="legend-dot result-missed"></i> richtig, nicht gewählt</span></div>`;
  if(inExam){examRecord(ok);setTimeout(()=>{if(examActive&&mode==='exam')qExam()},1200)}

function directLines(a,b){return LINES.filter(l=>ROUTES[l].some(s=>same(s,a))&&ROUTES[l].some(s=>same(s,b))).sort(numericSort)}
function qConnections(q=null){
  const eligible=CONNECTION_PAIRS.filter(([a,b])=>directLines(a,b).length);

  quiz.innerHTML=`<div class="kicker">Direktverbindung</div>

  let ok=JSON.stringify(s)===JSON.stringify(c);const inExam=examActive&&mode==='exam';if(inExam)stopExamTimer();current.answered=true;register(ok,current);
  document.querySelectorAll('.pill[data-line]').forEach(el=>{

  if(inExam){examRecord(ok);setTimeout(()=>{if(examActive&&mode==='exam')qExam()},1200)}
}

function qLinked(q=null){
  let pair,subtype,base;
  if(q){pair=q.pair;subtype=q.subtype;base=q.base}
  else{
    const candidates=LINKED_PAIRS.flatMap(p=>[
      {pair:p,subtype:'pair',base:''},{pair:p,subtype:'ends',base:''},
      {pair:p,subtype:'partner',base:p.a},{pair:p,subtype:'partner',base:p.b}
    ]);
    const pick=freshPick('linked',candidates,x=>`${x.pair.a}+${x.pair.b}|${x.subtype}|${x.base||''}`);
    pair=pick.pair;subtype=pick.subtype;base=pick.base;
  }
  let question,answer,opts;
  if(subtype==='pair'){
    question=`Welche zwei Linien bilden gemeinsam die Verbindung <strong>${pair.ends}</strong>?`;
    answer=`${pair.a} + ${pair.b}`;
    opts=shuffle([answer,...shuffle(LINKED_PAIRS.filter(x=>x!==pair)).map(x=>`${x.a} + ${x.b}`)]);
  }else if(subtype==='partner'){
    base=base||(Math.random()<.5?pair.a:pair.b);const partner=base===pair.a?pair.b:pair.a;
    question=`Mit welcher Linie ist die Linie ${badge(base)} verknüpft?`;answer=partner;
    opts=shuffle([answer,...shuffle(LINES.filter(x=>x!==answer&&x!==base)).slice(0,3)]);
  }else{
    question=`Welche Gesamtstrecke gehört zu den verknüpften Linien <strong>${pair.a} + ${pair.b}</strong>?`;answer=pair.ends;
    opts=shuffle([answer,...LINKED_PAIRS.filter(x=>x!==pair).map(x=>x.ends)]);
  }
  current={type:'linked',pair,subtype,base,answer};single('Verknüpfte Linien',question,opts,answer);
}
function qEnds(q=null){
  if(!q && Math.random()<0.35){qLinked();return;}
  const l=q?.line||freshPick('ends',LINES,x=>x),r=ROUTES[l],ans=`${r[0]} ↔ ${r.at(-1)}`;
  const opts=shuffle([ans,...shuffle(LINES.filter(x=>x!==l)).slice(0,3).map(x=>`${ROUTES[x][0]} ↔ ${ROUTES[x].at(-1)}`)]);
  current={type:'ends',line:l,answer:ans};
  const linked=LINKED_LINES[l]?`<div class="sub">🔗 Linie ${l} ist mit Linie ${LINKED_LINES[l].partner} verknüpft · Gesamtverbindung: ${LINKED_LINES[l].ends}</div>`:'';
  single(`TRAM ${badge(l)}${linked}`,`Welche Endpunkte gehören zu dieser Linie?`,opts,ans);
}

const NEXT_ROUTES={...ROUTES};

function single(k,q,opts,ans){quiz.innerHTML=`<div class="kicker">${k}</div><div class="question">${q}</div><div class="options">${opts.map(o=>`<button class="option" onclick='choose(this,${JSON.stringify(o)},${JSON.stringify(ans)})'>${o}</button>`).join('')}</div><div id="fb" class="feedback"></div><div class="controls"><div class="control-left"><button class="btn" onclick="skipQuestion()">Überspringen →</button><button class="btn" onclick="next()">Weiter →</button></div></div>`}

function stopExamTimer(){
  if(examTimerId){clearInterval(examTimerId);examTimerId=null}
}
function buildExamQueue(){
  const queue=[];let last='';
  for(let round=0;round<EXAM_PER_TYPE;round++){
    let order=shuffle(EXAM_TYPES);
    if(last&&order[0]===last&&order.length>1){const t=order[0];order[0]=order[1];order[1]=t}
    queue.push(...order);last=order.at(-1);
  }
  return queue;
}
function initExamBreakdown(){
  examByType=Object.fromEntries(EXAM_TYPES.map(t=>[t,{correct:0,done:0}]));
}
function examRecord(ok){
  if(!examActive||mode!=='exam')return;
  if(ok)examScore++;
  if(examCurrentType&&examByType[examCurrentType]){
    examByType[examCurrentType].done++;
    if(ok)examByType[examCurrentType].correct++;
  }
  examLeft=Math.max(0,examLeft-1);
}
function updateExamTimer(){
  if(!examActive||mode!=='exam')return;
  const left=Math.max(0,Math.ceil((examDeadline-Date.now())/1000));
  const el=document.getElementById('examTimer');
  if(el){el.textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;el.classList.toggle('warning',left<=10)}

}
function startExamTimer(){

}
function decorateExamQuestion(){

  quiz.insertAdjacentHTML('afterbegin',`<div class="exam-head"><span>Frage ${n} von ${EXAM_TOTAL} · ${EXAM_LABELS[examCurrentType]} ${typeDone}/${EXAM_PER_TYPE}</span><span id="examTimer" class="exam-timer">1:00</span></div><div class="exam-progress"><span style="width:${((n-1)/EXAM_TOTAL)*100}%"></span></div>`);

}
function renderExamTimeoutAnswer(){

    const wrap=document.getElementById('mapwrap');
    if(wrap&&HOTSPOTS[current.stop]){const [tx,ty]=HOTSPOTS[current.stop];const marker=document.createElement('div');marker.className='mapmarker answer';marker.style.left=tx+'%';marker.style.top=ty+'%';wrap.appendChild(marker)}
    if(f){f.className='feedback bad';f.innerHTML=`Zeit abgelaufen. Der grüne Punkt zeigt <b>${current.stop}</b>.`}

  }

  if(current?.answer){
    [...document.querySelectorAll('.option')].forEach(x=>{if(x.textContent===current.answer)x.classList.add('correct')});
    if(f){f.className='feedback bad';f.innerHTML=`Zeit abgelaufen. Richtig: <b>${current.answer}</b>`}
  }else if(Array.isArray(current?.correct)){
    const txt=current.type==='nodes'?current.correct.map(displayNodeName).join(', '):current.correct.join(', ');
    if(f){f.className='feedback bad';f.innerHTML=`Zeit abgelaufen. Richtig: <b>${txt}</b>`}
  }else if(current?.stop){
    if(f){f.className='feedback bad';f.innerHTML=`Zeit abgelaufen. Richtig: <b>${current.stop}</b>`}
  }
}
function examTimeout(){
  if(!examActive||mode!=='exam'||current?.answered)return;

  setTimeout(()=>{if(examActive&&mode==='exam')qExam()},1300);

function startExam(){

function recordExamResult(pct){
  examHistory.push({pct,ts:Date.now()});
  if(examHistory.length>20)examHistory=examHistory.slice(-20);
  save();
}
function examMessage(pct){
  const lastThree=examHistory.slice(-3);
  if(lastThree.length===3&&lastThree.every(x=>Number(x.pct)<35))return 'Dreimal unter 35 % … jetzt hilft nur noch Feldforschung. 😄 Lernrunde einlegen – oder ab ins Tram und Zürich erfahren. 🚋';
  if(pct===100)return 'Geschafft – bald wird eine Tramstrecke nach dir benannt. 🚋😉';
  if(pct>=90)return 'Sehr stark! Nur noch ein paar Haltestellen trennen dich vom Tram-Nerd-Status. 😉';
  if(pct>=80)return 'Stark. Du könntest langsam anfangen, anderen den Weg zu erklären.';
  if(pct>=65)return 'Sehr ordentlich! Zürich wird langsam übersichtlich. 😎';
  if(pct>=50)return 'Halbe Strecke geschafft. Du weisst schon ziemlich gut, wo die Reise hingeht.';
  if(pct>=35)return 'Die Richtung stimmt – aber ein paar Linien fahren noch ohne dich. 🚋';

}

  recordExamResult(pct);
  const breakdown=EXAM_TYPES.map(t=>`<div class="exam-breakdown-row"><span>${EXAM_LABELS[t]}</span><b>${examByType[t]?.correct||0} / ${EXAM_PER_TYPE}</b></div>`).join('');
  quiz.innerHTML=`<div class="kicker">Prüfung beendet</div><div class="question">${examScore} / ${EXAM_TOTAL} richtig</div><div class="exam-message">${examMessage(pct)}</div><div class="exam-end-grid"><div class="exam-end-stat"><b>${pct}%</b>Trefferquote</div><div class="exam-end-stat"><b>${wrong}</b>falsch</div><div class="exam-end-stat"><b>${examTimedOut}</b>Zeit abgelaufen</div></div><div class="sub"><strong>Auswertung nach Quiz:</strong></div><div class="exam-breakdown">${breakdown}</div><div class="controls"><button class="btn" onclick="mode='repeat';next()">Fehler wiederholen</button><button class="btn primary" onclick="startExam()">Neue Prüfung</button></div>`;
}
function qExam(){
  stopExamTimer();
  if(examLeft<=0){finishExam();return}
  examActive=true;mode='exam';
  const idx=EXAM_TOTAL-examLeft;
  examCurrentType=examQueue[idx]||EXAM_TYPES[idx%EXAM_TYPES.length];
  if(examCurrentType==='ends')qEnds();
  else if(examCurrentType==='stop')qStop();
  else if(examCurrentType==='nodes')qNodes();
  else if(examCurrentType==='connections')qConnections();
  else if(examCurrentType==='mapquiz')qMapQuiz();
  else if(examCurrentType==='next')qNext();
  else qImages();
  decorateExamQuestion();startExamTimer();
}


document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  stopExamTimer();
  const target=b.dataset.mode;
  if(target==='exam'){startExam();return}
  examActive=false;mode=target;next();
});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').then(r=>r.update()).catch(()=>{}));
load();next();
</script></body></html>

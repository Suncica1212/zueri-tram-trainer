:root{--bg:#f4f6f8;--card:#fff;--ink:#111820;--muted:#647180;--blue:#0a64b7;--line:#dde4ea;--ok:#087a42;--bad:#b3252a}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:820px;margin:auto;padding:16px;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
header{background:linear-gradient(135deg,#0a64b7,#084d8b);color:white;border-radius:20px;padding:22px;box-shadow:0 10px 28px #0a356622}
h1{margin:0;font-size:clamp(30px,8vw,48px);line-height:1} header p{margin:8px 0 0;opacity:.9}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px} .stat{background:#ffffff20;border:1px solid #ffffff2b;border-radius:13px;padding:10px;text-align:center} .stat b{display:block;font-size:22px}

.tab,.btn,.option,.pill{border:1px solid var(--line);background:white;border-radius:13px;cursor:pointer}
.tab{padding:12px 8px;font-weight:750;min-width:0;width:100%;white-space:normal;line-height:1.15} .tab.active{background:var(--blue);color:white;border-color:var(--blue)}
.card{background:white;border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 5px 18px #14202d10}
.kicker{font-size:12px;color:var(--blue);font-weight:850;letter-spacing:.09em;text-transform:uppercase}
.question{font-size:24px;font-weight:850;line-height:1.18;margin:7px 0 16px} .sub{color:var(--muted);margin-bottom:14px}
.options{display:grid;gap:9px} .option{padding:13px 14px;text-align:left;font-size:16px} .option.correct{background:#e8f7ef;border-color:#77c89e} .option.wrong{background:#fff0f0;border-color:#e6a0a3}
.pills{display:flex;flex-wrap:wrap;gap:8px} .pill{display:flex;align-items:center;gap:8px;padding:7px 10px;font-weight:750} .pill.sel{outline:none}.pill.sel .badge{background:#0a64b7;color:#fff;border-color:#0a64b7}
.badge.result-correct{background:#0a64b7;color:#fff;border-color:#0a64b7}.badge.result-wrong{background:#c62f35;color:#fff;border-color:#c62f35}.badge.result-missed{background:#111;color:#fff;border-color:#111}
.badge{width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#0a64b7;background:#fff;border:2px solid #0a64b7;font-weight:900;flex:none;box-shadow:none}
.controls{display:flex;gap:9px;justify-content:space-between;align-items:center;margin-top:17px;flex-wrap:wrap}.control-left{display:flex;gap:9px;align-items:center;flex-wrap:wrap} .btn{padding:12px 14px;font-weight:800} .btn.primary{background:var(--blue);color:white;border-color:var(--blue)}
.feedback{margin-top:14px;padding:12px;border-radius:12px;display:none} .feedback.ok{display:block;background:#e8f7ef;color:#075c32} .feedback.bad{display:block;background:#fff0f0;color:#8d171b}
.route{background:#eef5fb;padding:14px;border-radius:14px;line-height:1.65;margin-top:10px}
.footer{text-align:center;color:var(--muted);font-size:12px;padding:18px 8px}
@media(min-width:720px){}

.mapwrap{position:relative;width:100%;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;touch-action:manipulation}
.mapwrap img{display:block;width:100%;height:auto}
.mapmarker{position:absolute;width:28px;height:28px;border-radius:50%;transform:translate(-50%,-50%);border:4px solid #fff;box-shadow:0 2px 9px #0005;pointer-events:none}
.mapmarker.pick{background:#0a64b7}
.mapmarker.answer{background:#0a9b52}
.mapmarker.wrong{background:#c62f35}

@media (min-width:1051px){

function norm(s){return s.toLowerCase().replace('bahnhofstrasse/hb','bahnhofstr./hb').replace(/[.,/()-]/g,' ').replace(/\s+/g,' ').trim()}
function same(a,b){let A=norm(a),B=norm(b);if(A===B)return true;if(A.includes(B)||B.includes(A))return Math.min(A.length,B.length)>6;return false}
function linesAt(stop){return LINES.filter(l=>ROUTES[l].some(s=>same(s,stop)))}
function numericSort(a,b){return Number(a)-Number(b)}
function questionKey(q){if(!q)return'';return [q.type,q.stop||'',q.line||'',q.i??''].join('|')}
function register(ok,q){attempts++;if(ok)score++;else if(q)mistakes.push({...q});save()}
function rememberCurrent(){lastQuestionKey=questionKey(current)}
function next(){
  if(current) rememberCurrent();
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));
  if(mode==='stop')qStop();
  else if(mode==='ends')qEnds();
  else if(mode==='nodes')qNodes();
  else if(mode==='connections')qConnections();
  else if(mode==='next')qNext();
  else if(mode==='images')qImages();
  else if(mode==='repeat')qRepeat();
  else if(mode==='skipped')qSkipped();
  else if(mode==='mapquiz')qMapQuiz();
  else if(mode==='map')qMap();
  else qExam();
}
function skipQuestion(){
  if(current && !current.answered){skippedCount++;skippedQuestions.push({...current});current.answered=true;save()}
  next();
}
function avoidRepeat(makeQuestion){for(let i=0;i<12;i++){makeQuestion();if(questionKey(current)!==lastQuestionKey)return;} }
function qMapQuiz(q=null){
  if(!q){let stop;do{stop=sample(MAP_STOPS)}while('mapquiz|'+stop+'||'===lastQuestionKey);q={stop}}
  const stop=q?.stop||sample(MAP_STOPS);
  current={type:'mapquiz',stop};
  quiz.innerHTML=`
    <div class="kicker">Karten-Quiz</div>
    <div class="question">Wo befindet sich <strong>${stop}</strong>?</div>
    <div class="sub">Tippe möglichst genau auf die Haltestelle. Überspringen zählt nicht als Fehler.</div>
    <div id="mapwrap" class="mapwrap" onclick="mapPick(event)">
      <img src="tramnetz-quiz-ohne-ortschaften.png" alt="Tramliniennetz Zürich 2026 – Quizkarte">
    </div>
    <div id="fb" class="feedback"></div>
    <div class="controls"><div class="control-left"><button class="btn" onclick="skipQuestion()">Überspringen →</button><button class="btn" onclick="next()">Weiter →</button></div></div>`;
}

function mapPick(ev){
  if(current?.answered) return;
  const wrap=document.getElementById('mapwrap');
  const rect=wrap.getBoundingClientRect();
  const x=((ev.clientX-rect.left)/rect.width)*100;
  const y=((ev.clientY-rect.top)/rect.height)*100;
  const [tx,ty]=HOTSPOTS[current.stop];

  // Compare in actual screen pixels, not percentage units.
  // This avoids false negatives caused by different map aspect ratios.
  const tapX=(x/100)*rect.width;
  const tapY=(y/100)*rect.height;
  const targetX=(tx/100)*rect.width;
  const targetY=(ty/100)*rect.height;
  const distPx=Math.hypot(tapX-targetX,tapY-targetY);

  // Generous mobile hit radius: minimum 34px, scales slightly on larger screens.
  const hitRadius=Math.max(34, Math.min(48, rect.width*0.085));
  const ok=distPx<=hitRadius;
  current.answered=true;
  register(ok,current);

  const marker=document.createElement('div');
  marker.className='mapmarker '+(ok?'pick':'answer');
  marker.style.left=(ok?x:tx)+'%';
  marker.style.top=(ok?y:ty)+'%';
  wrap.appendChild(marker);

  const f=document.getElementById('fb');
  f.className='feedback '+(ok?'ok':'bad');
  f.innerHTML=ok ? `Treffer! <b>${current.stop}</b>.`
                 : `Nicht ganz. Der <b>grüne Punkt</b> zeigt die Position von <b>${current.stop}</b>.`;

  document.querySelector('.controls').innerHTML=
    '<div class="control-left"><button class="btn" onclick="skipQuestion()">Überspringen →</button><button class="btn" onclick="next()">Weiter →</button></div>';
}

function qMap(){
  quiz.innerHTML=`
    <div class="kicker">Tramlinien 2026</div>

    <div class="sub">Nur Tramlinien – inklusive der temporären Linie 16 sowie der Baustellenlinien 50 und 51.</div>

}

function qStop(q=null){
  const make=()=>{let stop=q?.stop||sample(IMPORTANT.filter(s=>linesAt(s).length));let correct=linesAt(stop);current={type:'stop',stop,correct};
  quiz.innerHTML=`<div class="kicker">Mehrfachauswahl</div><div class="question">Welche Tramlinien halten am <strong>${stop}</strong>?</div><div class="sub">Alle passenden Linien wählen.</div>
  <div class="pills">${LINES.map(l=>`<button class="pill" data-line="${l}" onclick="this.classList.toggle('sel')">${badge(l)}</button>`).join('')}</div>
  <div id="fb" class="feedback"></div><div class="controls"><div class="control-left"><button class="btn" onclick="skipQuestion()">Überspringen →</button><button class="btn" onclick="next()">Weiter →</button></div><button class="btn primary" onclick="checkStop()">Prüfen</button></div>`};
  if(q)make();else avoidRepeat(make)
}
function checkStop(){
  if(current?.answered)return;
  let s=[...document.querySelectorAll('.pill.sel')].map(x=>x.dataset.line).sort(numericSort);
  let c=[...current.correct].sort(numericSort);let ok=JSON.stringify(s)===JSON.stringify(c);current.answered=true;register(ok,current);
  const all=[...new Set([...s,...c])].sort(numericSort);
  const result=all.map(l=>badge(l,s.includes(l)?(c.includes(l)?'result-correct':'result-wrong'):'result-missed')).join(' ');
  showFb(ok,`${ok?'Richtig':'Auswertung'}: ${result}`)
}


function displayNodeName(s){
  return s.replace(/^Zürich,\s*/,'').replace(/^Zürich\s+/,'');
}

function qNodes(q=null){
  const eligible=LINES.filter(l=>IMPORTANT_NODES_BY_LINE[l] && IMPORTANT_NODES_BY_LINE[l].length);
  const line=q?.line||sample(eligible);
  const correct=IMPORTANT_NODES_BY_LINE[line];

  const allNodes=[...new Set(Object.values(IMPORTANT_NODES_BY_LINE).flat())];
  const distractors=shuffle(allNodes.filter(n=>!correct.includes(n)))
    .slice(0, Math.max(3, Math.min(5, 9-correct.length)));
  const choices=shuffle([...correct,...distractors]);

  current={type:'nodes',line,correct};

  quiz.innerHTML=`
    <div class="kicker">Wichtige Knotenpunkte</div>
    <div class="question">Welche wichtigen Knotenpunkte befinden sich auf Linie ${badge(line)}?</div>
    <div class="sub">Wähle alle passenden Knotenpunkte.</div>
    <div class="pills">
      ${choices.map((n,i)=>`<button class="pill nodepill" data-node="${i}" data-name="${encodeURIComponent(n)}" onclick="this.classList.toggle('sel')">${displayNodeName(n)}</button>`).join('')}
    </div>
    <div id="fb" class="feedback"></div>
    <div class="controls">
      <div style="display:flex;gap:9px;flex-wrap:wrap">
        <button class="btn" onclick="skipQuestion()">Überspringen →</button>
        <button class="btn" onclick="next()">Weiter →</button>
      </div>
      <button class="btn primary" onclick="checkNodes()">Prüfen</button>
    </div>`;
}

function checkNodes(){
  if(current?.type!=='nodes' || current?.answered) return;
  current.answered=true;
  const selected=[...document.querySelectorAll('.nodepill.sel')]
    .map(x=>decodeURIComponent(x.dataset.name));

  const s=[...selected].sort((a,b)=>a.localeCompare(b));
  const c=[...current.correct].sort((a,b)=>a.localeCompare(b));
  const ok=JSON.stringify(s)===JSON.stringify(c);
  register(ok,current);

  document.querySelectorAll('.nodepill').forEach(el=>{
    const n=decodeURIComponent(el.dataset.name);
    const isCorrect=current.correct.includes(n);
    const isSelected=el.classList.contains('sel');
    if(isCorrect) el.classList.add('correct');
    if(isSelected && !isCorrect) el.classList.add('wrong');
  });

  const f=document.getElementById('fb');
  f.className='feedback '+(ok?'ok':'bad');
  f.innerHTML=ok
    ? `Richtig: <b>${current.correct.map(displayNodeName).join(' · ')}</b>`
    : `Richtig sind: <b>${current.correct.map(displayNodeName).join(' · ')}</b>`;
}

Triemli"},{"src":"bilderquiz/Werdhoelzli.jpg","stop":"Werdhölzli"},{"src":"bilderquiz/Wollishofen.jpg","stop":"Bahnhof Wollishofen"},{"src":"bilderquiz/Wollishoferplatz.jpg","stop":"Wollishoferplatz"},{"src":"bilderquiz/Wollishoferplatz_02.jpg","stop":"Wollishoferplatz"},{"src":"bilderquiz/Zoo_01.jpg","stop":"Zoo"},{"src":"bilderquiz/Zoo_02.jpg","stop":"Zoo"}];
function qImages(q=null){
  const make=()=>{
    let item=q?.src?{src:q.src,stop:q.stop}:sample(IMAGE_QUIZ);
    current={type:'images',src:item.src,stop:item.stop};
    const stations=[...new Set(IMAGE_QUIZ.map(x=>x.stop))];
    const opts=shuffle([item.stop,...shuffle(stations.filter(s=>s!==item.stop)).slice(0,3)]);
    quiz.innerHTML=`<div class="kicker">Bilder-Quiz</div><div class="question">Welche Haltestelle ist auf diesem Bild zu sehen?</div>

      <div class="options">${opts.map(o=>`<button class="option" onclick='choose(this,${JSON.stringify(o)},${JSON.stringify(item.stop)})'>${o}</button>`).join('')}</div>
      <div id="fb" class="feedback"></div><div class="controls"><div class="control-left"><button class="btn" onclick="skipQuestion()">Überspringen →</button><button class="btn" onclick="next()">Weiter →</button></div></div>`;
  };
  if(q)make();else avoidRepeat(make);
}

const CONNECTION_PAIRS=[
  ['Central','Bellevue'],
  ['Bahnhofstrasse/HB','Laubegg'],
  ['Paradeplatz','Bellevue'],
  ['Central','Bahnhofstrasse/HB'],
  ['Stauffacher','Paradeplatz'],
  ['Bellevue','Bahnhof Stadelhofen'],
  ['Milchbuck','Central'],
  ['Schaffhauserplatz','Central'],
  ['Goldbrunnenplatz','Stauffacher'],
  ['Bahnhof Enge','Bellevue'],

  ['Römerhof','Central'],
  ['Klusplatz','Central'],
  ['Hardturm','Bellevue'],
  ['Triemli','Stauffacher']
];
function directLines(a,b){return LINES.filter(l=>ROUTES[l].some(s=>same(s,a))&&ROUTES[l].some(s=>same(s,b))).sort(numericSort)}
function qConnections(q=null){
  const make=()=>{
    let pair=q?.pair||sample(CONNECTION_PAIRS.filter(([a,b])=>directLines(a,b).length));
    let [from,to]=pair,correct=directLines(from,to);
    current={type:'connections',pair:[from,to],correct};
    quiz.innerHTML=`<div class="kicker">Direktverbindung</div>
      <div class="question">Welche Tramlinie${correct.length===1?'':'n'} bringt dich ohne Umsteigen von <strong>${from}</strong> nach <strong>${to}</strong>?</div>
      <div class="sub">Wähle alle Linien, mit denen du beide Haltestellen direkt erreichst.</div>
      <div class="pills">${LINES.map(l=>`<button class="pill" data-line="${l}" onclick="this.classList.toggle('sel')">${badge(l)}</button>`).join('')}</div>
      <div id="fb" class="feedback"></div>
      <div class="controls"><div class="control-left"><button class="btn" onclick="skipQuestion()">Überspringen →</button><button class="btn" onclick="next()">Weiter →</button></div><button class="btn primary" onclick="checkConnections()">Prüfen</button></div>`;
  };
  if(q)make();else avoidRepeat(make)
}
function checkConnections(){
  if(current?.type!=='connections'||current?.answered)return;
  let s=[...document.querySelectorAll('.pill.sel')].map(x=>x.dataset.line).sort(numericSort);
  let c=[...current.correct].sort(numericSort);
  let ok=JSON.stringify(s)===JSON.stringify(c);current.answered=true;register(ok,current);
  const all=[...new Set([...s,...c])].sort(numericSort);
  const result=all.map(l=>badge(l,s.includes(l)?(c.includes(l)?'result-correct':'result-wrong'):'result-missed')).join(' ');
  showFb(ok,`${ok?'Richtig':'Auswertung'}: ${result}`)
}

function qEnds(q=null){const make=()=>{let l=q?.line||sample(LINES),r=ROUTES[l],ans=`${r[0]} ↔ ${r.at(-1)}`;let opts=shuffle([ans,...shuffle(LINES.filter(x=>x!==l)).slice(0,3).map(x=>`${ROUTES[x][0]} ↔ ${ROUTES[x].at(-1)}`)]);current={type:'ends',line:l,answer:ans};single(`TRAM ${badge(l)}`,`Welche Endpunkte gehören zu dieser Linie?`,opts,ans)};if(q)make();else avoidRepeat(make)}
function qNext(q=null){const make=()=>{let l=q?.line||sample(LINES),r=ROUTES[l],i=q?.i??Math.floor(Math.random()*(r.length-1)),ans=r[i+1];let pool=[...new Set(Object.values(ROUTES).flat())].filter(x=>x!==ans&&x!==r[i]);let opts=shuffle([ans,...shuffle(pool).slice(0,3)]);current={type:'next',line:l,i,answer:ans};single(`TRAM ${badge(l)}`,`Was kommt Richtung <strong>${r.at(-1)}</strong> direkt nach <strong>${r[i]}</strong>?`,opts,ans)};if(q)make();else avoidRepeat(make)}
function single(k,q,opts,ans){quiz.innerHTML=`<div class="kicker">${k}</div><div class="question">${q}</div><div class="options">${opts.map(o=>`<button class="option" onclick='choose(this,${JSON.stringify(o)},${JSON.stringify(ans)})'>${o}</button>`).join('')}</div><div id="fb" class="feedback"></div><div class="controls"><div class="control-left"><button class="btn" onclick="skipQuestion()">Überspringen →</button><button class="btn" onclick="next()">Weiter →</button></div></div>`}
function choose(el,val,ans){if(current?.answered)return;let ok=val===ans;current.answered=true;register(ok,current);el.classList.add(ok?'correct':'wrong');[...document.querySelectorAll('.option')].forEach(x=>{if(x.textContent===ans)x.classList.add('correct')});showFb(ok,`Richtig: <b>${ans}</b>`)}
function showFb(ok,text){let f=document.getElementById('fb');f.className='feedback '+(ok?'ok':'bad');f.innerHTML=ok?text:`Noch nicht. ${text}`}
function renderStored(q){if(q.type==='stop')qStop(q);else if(q.type==='ends')qEnds(q);else if(q.type==='nodes')qNodes(q);else if(q.type==='connections')qConnections(q);else if(q.type==='mapquiz')qMapQuiz(q);else if(q.type==='images')qImages(q);else qNext(q)}
function qRepeat(){if(!mistakes.length){quiz.innerHTML=`<div class="question">Keine offenen Fehler</div><div class="sub">Falsch beantwortete Fragen landen automatisch hier.</div>`;current=null;return}let q=mistakes.shift();save();renderStored(q)}
function qSkipped(){if(!skippedQuestions.length){quiz.innerHTML=`<div class="question">Keine übersprungenen Fragen</div><div class="sub">Übersprungene Fragen kannst du hier gezielt nochmals üben.</div>`;current=null;return}let q=skippedQuestions.shift();save();renderStored(q)}
function qExam(){if(examLeft<=0){quiz.innerHTML=`<div class="kicker">Prüfung beendet</div><div class="question">${examScore} / 10 richtig</div><div class="sub">Starte eine neue 10-Fragen-Prüfung.</div><button class="btn primary" onclick="examLeft=10;examScore=0;qExam()">Neue Prüfung</button>`;return}let t=sample(['ends','next']);let old=mode;mode=t;let before=score; if(t==='ends')qEnds();else qNext(); let oldChoose=window.choose; window.choose=function(el,val,ans){if(document.querySelector('.option.correct,.option.wrong'))return;let ok=val===ans;if(ok)examScore++;examLeft--;oldChoose(el,val,ans);setTimeout(()=>{mode='exam';qExam()},650)}}


document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;if(mode==='exam'){examLeft=10;examScore=0}next()});
